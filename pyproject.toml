[project]
name = "elevation"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "pyyaml>=6.0.3",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "matplotlib>=3.11.2",
    "scipy>=1.18.1",
]

[project.scripts]
display = "elevation.__main__:main"

[tool.setuptools]
packages = ["elevation"]

[build-system]
requires = ['setuptools', "scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"
